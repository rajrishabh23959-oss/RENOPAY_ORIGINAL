name: Backend CI

on:
  push:
    branches: [main, master]
    paths: ["renopay-backend/**"]
  pull_request:
    branches: [main, master]
    paths: ["renopay-backend/**"]

defaults:
  run:
    working-directory: renopay-backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: renopay
          POSTGRES_PASSWORD: renopay
          POSTGRES_DB: renopay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://renopay:renopay@localhost:5432/renopay_test
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      FIELD_ENCRYPTION_KEY: DHjQsG_n64VHxjEFRl96-wX_RMmjnuV4dILhKjNlS3c=
      DATABASE_URL: postgresql+asyncpg://renopay:renopay@localhost:5432/renopay
      SYNC_DATABASE_URL: postgresql+psycopg2://renopay:renopay@localhost:5432/renopay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run migrations against the CI database
        run: alembic upgrade head
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://renopay:renopay@localhost:5432/renopay_test
      - name: Run test suite
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: renopay-backend
          push: false
          tags: renopay-backend:${{ github.sha }}
