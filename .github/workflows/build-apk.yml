name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'renopay-frontend/**'
      - 'andriod/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Generate RenoPay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: renopay-frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: renopay-frontend
        run: npm ci

      - name: Build Web Application
        working-directory: renopay-frontend
        env:
          VITE_API_BASE_URL: https://renopay-original.vercel.app/api
        run: npm run build

      - name: Prepare Capacitor Web Assets
        run: |
          mkdir -p andriod/www
          rm -rf andriod/www/*
          cp -r renopay-frontend/dist/* andriod/www/

      - name: Sync Capacitor Android Project
        working-directory: andriod
        run: |
          npm ci
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: andriod/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: andriod/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenoPay-Android-APK
          path: andriod/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
